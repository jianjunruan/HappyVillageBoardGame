<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快乐村桌游</title>
  <meta name="description" content="快乐村桌游俱乐部：桌游介绍、规则与教学视频。Board games we play at Happy Village — rules, pictures and how-to-play videos.">
  <link rel="icon" href="images/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="title-row">
        <h1><img class="logo" src="images/logo.png" alt="" width="56" height="56"> <span data-i18n="siteName">快乐村桌游</span></h1>
        <div class="header-actions">
          <span id="admin-bar" class="admin-bar" hidden></span>
          <button id="lang-toggle" class="lang-toggle" type="button">EN</button>
        </div>
      </div>
      <p class="tagline" data-i18n="tagline"></p>
      <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel">
      <div id="cats" class="tag-row cat-row" data-i18n-aria="catFilterLabel"></div>
      <div id="tags" class="tag-row" data-i18n-aria="tagFilterLabel"></div>
      <div id="loan-filter" class="tag-row" data-i18n-aria="loanFilterLabel" hidden></div>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status" role="status" data-i18n="loading"></p>
    <div id="grid" class="groups"></div>
  </main>

  <footer class="wrap site-footer">
    <p data-i18n="footer"></p>
  </footer>

  <dialog id="detail" aria-labelledby="detail-title">
    <button class="close" data-close data-i18n-aria="close">✕</button>
    <article id="detail-body"></article>
  </dialog>

  <dialog id="login" class="login" aria-labelledby="login-title">
    <form id="login-form" class="login-form">
      <h2 id="login-title" data-i18n="adminLogin"></h2>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="form-error" role="alert"></p>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-login-cancel data-i18n="cancel"></button>
        <button type="submit" class="btn" data-i18n="signIn"></button>
      </div>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/media.js"></script>
  <script src="js/data.js"></script>
  <script src="js/loans.js"></script>
  <script src="js/rulebook-share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
